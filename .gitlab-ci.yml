stages:
  - deploy

.ssh_setup: &ssh_setup
  image: alpine:3.19
  tags:
    - api-playground
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

deploy-app:
  <<: *ssh_setup
  stage: deploy
  script:
    - ssh -tt -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
        'cd /opt/api-playground/app && git pull origin main && npm ci && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public && sudo systemctl restart api-playground'
  environment:
    name: production
    url: http://172.17.4.105:3002

deploy-raster:
  <<: *ssh_setup
  stage: deploy
  script:
    - scp -P "$DEPLOY_PORT" scripts/raster_service/main.py scripts/raster_service/requirements.txt "$DEPLOY_USER@$DEPLOY_HOST:/opt/api-playground/services/raster/"
    - ssh -tt -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
        '/opt/api-playground/services/raster/venv/bin/pip install -q -r /opt/api-playground/services/raster/requirements.txt && sudo systemctl restart merit-raster'
  environment:
    name: production
