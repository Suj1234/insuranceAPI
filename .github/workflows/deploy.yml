name: Build & Deploy

# Runs on a SELF-HOSTED runner that lives ON the server (inside the VPN), so it
# can reach both harbor.hinagro.com and the local docker daemon. No SSH step —
# docker commands run locally on the box.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   HARBOR_USERNAME – Harbor login user
#   HARBOR_PASSWORD – Harbor login password
#
# Server prerequisites (one-time, see docs/deploy-github-actions.md):
#   - a registered + running self-hosted runner for THIS repo
#   - the runner user can run docker (in the `docker` group)
#   - /opt/api-playground/.env.production exists

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: harbor.hinagro.com/insurance/api-playground:latest

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Harbor
        run: echo "${{ secrets.HARBOR_PASSWORD }}" | docker login harbor.hinagro.com -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Push image to Harbor
        run: docker push "$IMAGE"

      - name: Stop and remove old container
        run: |
          docker rm -f api-playground || true
          # Free port 5011 in case an orphan/differently-named container holds it
          docker ps -q --filter "publish=5011" | xargs -r docker rm -f

      - name: Run new container
        run: |
          docker run -d \
            --name api-playground \
            --restart unless-stopped \
            --network insurance_network \
            -p 5011:3000 \
            --env-file /opt/api-playground/.env.production \
            "$IMAGE"
