name: Build & Deploy

# Build the app image, push to Harbor, and run it on the server.
# Runs on a SELF-HOSTED runner that lives ON the server (172.17.4.105), so there
# is no SSH step — docker commands run locally on the box.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   HARBOR_USERNAME – Harbor login user
#   HARBOR_PASSWORD – Harbor login password
#
# Prerequisites on the server:
#   - a registered self-hosted GitHub Actions runner for THIS repo
#   - /opt/api-playground/.env.production present (INTERNAL_ENV_API_KEY,
#     DATABASE_URL, KARZA_KEY, KARZA_BASE_URL, NEXT_PUBLIC_APP_URL, …)
# See docs/deploy-github-actions.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Harbor
        run: echo "${{ secrets.HARBOR_PASSWORD }}" | docker login harbor.hinagro.com -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t api-playground:latest .

      - name: Tag image for Harbor
        run: docker tag api-playground:latest harbor.hinagro.com/insurance/api-playground:latest

      - name: Push image to Harbor
        run: docker push harbor.hinagro.com/insurance/api-playground:latest

      - name: Stop and remove old container
        run: |
          docker rm -f api-playground || true
          # Free port 5011 in case an orphan/differently-named container holds it
          docker ps -q --filter "publish=5011" | xargs -r docker rm -f

      - name: Run new container
        run: |
          docker run -d \
            --name api-playground \
            --restart unless-stopped \
            -p 5011:3000 \
            --env-file /opt/api-playground/.env.production \
            harbor.hinagro.com/insurance/api-playground:latest
